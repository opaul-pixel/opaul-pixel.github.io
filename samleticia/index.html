<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sam &amp; Leticia — Find Your Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b0d13;
  --card:#f6f1e7;
  --ink:#241a14;
  --muted:#8a7f74;
  --accent:#8f2a3a;
  --gold:#c9a55c;
  --line:#e4dccb
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 40px;background:var(--bg);color:var(--ink);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

/* ── hero photo, full frame, title sits low over the clothing ───────── */
.hero{position:relative;width:100%;line-height:0;overflow:hidden}
.hero-photo{display:block;width:100%;height:auto}
.hero-overlay{position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,transparent 40%,rgba(20,6,9,.55) 58%,rgba(20,6,9,.88) 74%,var(--bg) 100%)}
.hero-text{position:absolute;left:0;right:0;top:47%;text-align:center;padding:0 20px;z-index:1}
.hero-text h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:30px;
  line-height:1.1;margin:0;color:#fff}
.hero-text .amp{display:inline-block;font-style:italic;font-weight:500;font-size:21px;
  color:#f2e4c9;margin:0 5px}
.hero-text .tag{font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:14px;
  color:#f2e4c9;margin:5px 0 0;letter-spacing:.02em}

/* ── editorial panel ──────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto}
.panel{background:var(--card);border-radius:26px;padding:16px 20px 20px;
  margin-top:-116px;position:relative;z-index:1}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.8px}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;
  background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:600;border:0;
  border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:active{opacity:.85}
#out{margin-top:12px;padding-bottom:10px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
  text-align:center}
.nm{font-size:14px;color:var(--muted);margin:0 0 6px}
.tl{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:2px 0 0}
.hint{font-size:11px;color:var(--muted);margin-top:14px;opacity:.7}

/* slot reel */
.reel-frame{height:52px;overflow:hidden;position:relative;margin:0 auto;width:100%;
  border-radius:8px}
.reel-frame::before,.reel-frame::after{content:"";position:absolute;left:0;right:0;
  height:20px;z-index:2;pointer-events:none}
.reel-frame::before{top:0;background:linear-gradient(#fff,transparent)}
.reel-frame::after{bottom:0;background:linear-gradient(transparent,#fff)}
.reel-track{display:flex;flex-direction:column;align-items:center}
.reel-track div{height:52px;line-height:52px;font-size:36px;font-weight:700;color:var(--accent)}

.msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;
  font-size:15px;color:var(--muted)}
.pick{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pick p{margin:0;padding:14px 18px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{font-size:16px;color:var(--ink)}
.row span:last-child{color:var(--accent);font-weight:600;font-size:15px;white-space:nowrap;padding-left:14px}
.note{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}

.footer{margin-top:12px;text-align:center;font-size:10px;letter-spacing:.05em;
  color:var(--muted)}
.footer p{margin:0 0 3px}
.footer .brand{text-transform:uppercase;letter-spacing:.12em}
.footer .tagline{text-transform:uppercase;letter-spacing:.16em;font-size:10px;opacity:.8}
.footer a{color:inherit;text-decoration:none}
</style>
</head>

/* ── matching ─────────────────────────────────────────────── */
var TITLES = /^(ps|pastor|pst|dr|mr|mrs|ms|miss|rev|snr|sr)$/;

function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[’'`´]/g,"")
          .toLowerCase()
          .replace(/[^a-z0-9 ]/g," ")
          .split(/\s+/)
          .filter(function(t){return t && !TITLES.test(t);})
          .join(" ");
}

var INDEX = Object.keys(GUESTS).map(function(name){
  var n = norm(name);
  return {name:name, table:GUESTS[name], n:n, toks:n.split(" ")};
});

function search(raw){
  var q = norm(raw);
  if(q.length < 3) return {err:"short"};
  var qt = q.split(" ");

  var exact = INDEX.filter(function(g){return g.n === q;});
  if(exact.length) return {hits:exact};

  var hits = INDEX.filter(function(g){
    var pool = g.toks.slice();
    return qt.every(function(t){
      for(var i=0;i<pool.length;i++){
        if(pool[i].indexOf(t) === 0){ pool.splice(i,1); return true; }
      }
      return false;
    });
  });
  if(hits.length) return {hits:hits};

  hits = INDEX.filter(function(g){return g.n.indexOf(q) > -1;});
  return hits.length ? {hits:hits} : {err:"none"};
}

}

                    'or check the spelling. Use seating arrangement chart.</div>';
    return;
  }
  var h = r.hits;
  if(h.length === 1){
    reveal(h[0].name, h[0].table);
    return;
  }
  if(h.length > 6){
    out.innerHTML = '<div class="msg">That matches too many guests. Please enter your full name.</div>';
    return;
  }
  out.innerHTML = '<div class="pick"><p>Several guests match. Tap your name:</p>'+
    h.map(function(g,i){
      return '<div class="row" data-i="'+i+'"><span>'+esc(g.name)+'</span><span>Table '+g.table+'</span></div>';
    }).join("")+'</div>';

  var rows = out.querySelectorAll(".row");
  rows.forEach(function(row){
    row.addEventListener("click",function(){
      var g = h[+row.getAttribute("data-i")];
      reveal(g.name, g.table);
    });
  });
}

document.getElementById("go").addEventListener("click",function(){
  inp.blur(); show(inp.value);
});
inp.addEventListener("keydown",function(e){
  if(e.key === "Enter"){ e.preventDefault(); inp.blur(); show(inp.value); }
});
</script>
</body>
</html>
