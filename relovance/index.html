<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReloVance | See You Next Year</title>
<style>
  :root { --bg1:#1a0b1f; --bg2:#3b0f33; --rose:#ff6b8b; --gold:#f5d38a; --text:#fbeff3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg1) 70%);
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; overflow: hidden;
  }
  .hearts { position: fixed; inset: 0; pointer-events: none; }
  .hearts span {
    position: absolute; bottom: -40px; color: var(--rose); opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(.8); opacity: 0; }
    15% { opacity: .5; }
    100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
  }
  main { position: relative; max-width: 560px; }
  .eyebrow { letter-spacing: .35em; text-transform: uppercase; font-size: .75rem; color: var(--gold); }
  h1 { font-size: clamp(2rem, 8vw, 3.4rem); margin: .4em 0 .2em; font-weight: normal; }
  h1 em { color: var(--rose); font-style: italic; }
  .line { width: 70px; height: 1px; background: var(--gold); margin: 1.4rem auto; opacity: .7; }
  p { font-size: 1.1rem; line-height: 1.7; margin: .6em 0; color: #f0dbe3; }
  .teaser {
    margin-top: 1.6rem; font-size: 1.25rem; color: var(--gold);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .foot { margin-top: 2.4rem; font-size: .85rem; opacity: .75; font-family: system-ui, sans-serif; }
  .foot a { color: var(--rose); text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { .hearts span, .teaser { animation: none; opacity: .8; } }
</style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <main>
    <div class="eyebrow">ReloVance</div>
    <h1>What a night. <em>Thank you.</em></h1>
    <div class="line"></div>
    <p>The evening has come to a close, and the memories are ours to keep.</p>
    <p>Thank you to every couple, speaker, volunteer and guest who made it unforgettable.</p>
    <p class="teaser">Something special is already in the works.<br>Watch this space. &#10084;</p>
  </main>
<script>
  var box = document.getElementById('hearts');
  for (var i = 0; i < 16; i++) {
    var s = document.createElement('span');
    s.textContent = '\u2764';
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (10 + Math.random() * 18) + 'px';
    s.style.animationDuration = (9 + Math.random() * 9) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    box.appendChild(s);
  }
</script>
</body>
</html>
