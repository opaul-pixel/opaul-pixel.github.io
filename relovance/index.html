.hero{width:100%;display:block;line-height:0}
.hero img{width:100%;height:auto;display:block}

.wrap{max-width:520px;margin:0 auto}
.panel{background:rgba(255,250,242,.86);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border-radius:24px;padding:20px 20px 18px;
  margin:-4px 0 0;position:relative;z-index:1}

.panel-title{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:19px;
  line-height:1.3;color:var(--navy);text-align:center;margin:0 0 16px}
.panel-title .heart{color:var(--maroon)}

label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.8px;font-family:"Quicksand",sans-serif;font-weight:700}
input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;
  background:#fff;color:var(--ink);outline:none;font-family:inherit}
input:focus{border-color:var(--maroon)}
button{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:700;border:0;
  border-radius:12px;background:var(--maroon);color:#fff;cursor:pointer;
  font-family:"Quicksand",sans-serif;letter-spacing:.3px}
button:active{opacity:.85}

#out{margin-top:14px}

.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;
  text-align:center}
.nm{font-size:14px;color:var(--muted);margin:0 0 6px;font-family:"Quicksand",sans-serif}
.tl{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--navy);margin:10px 0 0;
  font-weight:700;font-family:"Quicksand",sans-serif}

/* wheel */
.wheel-wrap{position:relative;width:220px;height:220px;margin:2px auto 0;
  filter:drop-shadow(0 8px 16px rgba(36,16,100,.28))}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:22px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#wheelSvg{width:100%;height:100%;display:block;
  transition:transform 5.5s cubic-bezier(.15,.75,.2,1);transform-origin:50% 50%}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);
  width:54px;height:54px;border-radius:50%;background:var(--navy);color:var(--gold);
  border:2.5px solid var(--gold);display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1;font-weight:800;font-size:24px;z-index:3;pointer-events:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  transition:transform .5s cubic-bezier(.34,1.6,.64,1)}
.wheel-hub.landed{transform:translate(-50%,-50%) scale(1.16)}

.msg{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:18px;
  font-size:14px;color:var(--muted)}
.pick{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pick p{margin:0;padding:12px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{font-size:15px;color:var(--ink)}
.row span:last-child{color:var(--maroon);font-weight:700;font-size:14px;white-space:nowrap;padding-left:14px}

};

/* ── matching ─────────────────────────────────────────────── */
var TITLES = /^(ps|pastor|pst|dr|mr|mrs|ms|miss|rev|snr|sr)$/;

function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[’'`´]/g,"")
          .toLowerCase()
          .replace(/[^a-z0-9 ]/g," ")
          .split(/\s+/)
          .filter(function(t){return t && !TITLES.test(t);})
          .join(" ");
}

var INDEX = Object.keys(GUESTS).map(function(name){
  var n = norm(name);
  return {name:name, table:GUESTS[name], n:n, toks:n.split(" ")};
});

function search(raw){
  var q = norm(raw);
  if(q.length < 3) return {err:"short"};
  var qt = q.split(" ");

  var exact = INDEX.filter(function(g){return g.n === q;});
  if(exact.length) return {hits:exact};

  var hits = INDEX.filter(function(g){
    var pool = g.toks.slice();
    return qt.every(function(t){
      for(var i=0;i<pool.length;i++){
        if(pool[i].indexOf(t) === 0){ pool.splice(i,1); return true; }
      }
      return false;
    });
  });
  if(hits.length) return {hits:hits};

  hits = INDEX.filter(function(g){return g.n.indexOf(q) > -1;});
  return hits.length ? {hits:hits} : {err:"none"};
}

        '<svg id="wheelSvg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">\n  <circle cx="130" cy="130" r="128" fill="none" stroke="#160a30" stroke-width="14"/><circle cx="130" cy="130" r="128" fill="none" stroke="#caa03c" stroke-width="2"/><circle cx="130" cy="130" r="112" fill="none" stroke="#caa03c" stroke-width="1.5"/>   <path d="M130,130 L130.00,22.00 A108,108 0 0 1 223.53,76.00 Z" fill="#241064" stroke="#160a30" stroke-width="1.3"/>   <path d="M130,130 L223.53,76.00 A108,108 0 0 1 223.53,184.00 Z" fill="#7a0e12" stroke="#160a30" stroke-width="1.3"/>   <path d="M130,130 L223.53,184.00 A108,108 0 0 1 130.00,238.00 Z" fill="#caa03c" stroke="#160a30" stroke-width="1.3"/>   <path d="M130,130 L130.00,238.00 A108,108 0 0 1 36.47,184.00 Z" fill="#3d1a3a" stroke="#160a30" stroke-width="1.3"/>   <path d="M130,130 L36.47,184.00 A108,108 0 0 1 36.47,76.00 Z" fill="#241064" stroke="#160a30" stroke-width="1.3"/>   <path d="M130,130 L36.47,76.00 A108,108 0 0 1 130.00,22.00 Z" fill="#7a0e12" stroke="#160a30" stroke-width="1.3"/>   <text x="168.00" y="64.18" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="22" fill="#f6e9c9" style="paint-order:stroke;stroke:#00000066;stroke-width:2.5px">1</text>   <text x="206.00" y="130.00" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="22" fill="#f6e9c9" style="paint-order:stroke;stroke:#00000066;stroke-width:2.5px">2</text>   <text x="168.00" y="195.82" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="22" fill="#f6e9c9" style="paint-order:stroke;stroke:#00000066;stroke-width:2.5px">3</text>   <text x="92.00" y="195.82" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="22" fill="#f6e9c9" style="paint-order:stroke;stroke:#00000066;stroke-width:2.5px">4</text>   <text x="54.00" y="130.00" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="22" fill="#f6e9c9" style="paint-order:stroke;stroke:#00000066;stroke-width:2.5px">5</text>   <text x="92.00" y="64.18" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="22" fill="#f6e9c9" style="paint-order:stroke;stroke:#00000066;stroke-width:2.5px">6</text>   <circle cx="130.00" cy="10.00" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="167.08" cy="15.87" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="200.53" cy="32.92" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="227.08" cy="59.47" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="244.13" cy="92.92" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="250.00" cy="130.00" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="244.13" cy="167.08" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="227.08" cy="200.53" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="200.53" cy="227.08" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="167.08" cy="244.13" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="130.00" cy="250.00" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="92.92" cy="244.13" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="59.47" cy="227.08" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="32.92" cy="200.53" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="15.87" cy="167.08" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="10.00" cy="130.00" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="15.87" cy="92.92" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="32.92" cy="59.47" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="59.47" cy="32.92" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>   <circle cx="92.92" cy="15.87" r="3.6" fill="#fff3d6" stroke="#caa03c" stroke-width="0.6"/>\n</svg>' +
        '<div class="wheel-hub" id="hub">&#8226;</div>'+
      '</div>'+
      '<p class="tl">Table</p>'+
    '</div>';

  var wheel = document.getElementById("wheelSvg");
  var hub = document.getElementById("hub");
  var centerAngle = (table - 0.5) * WHEEL_SEG;
  var jitter = (Math.random() * 2 - 1) * (WHEEL_SEG * 0.28);
  var spins = 6;

  // fresh element every call (innerHTML rebuild) — always starts at 0deg,
  // so each spin is computed independently, never accumulated on top of a
  // previous, now-destroyed wheel element
  var rotation = spins * 360 - centerAngle + jitter;

  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";
  wheel.getBoundingClientRect();
  requestAnimationFrame(function(){
    wheel.style.transition = "transform 5.5s cubic-bezier(.15,.75,.2,1)";
    wheel.style.transform = "rotate("+rotation+"deg)";
  });

  wheel.addEventListener("transitionend", function landed(){
    wheel.removeEventListener("transitionend", landed);
    hub.textContent = table;
    hub.classList.add("landed");
    setTimeout(function(){ hub.classList.remove("landed"); }, 500);
  });
}

function show(raw){
  var r = search(raw||"");
  if(r.err === "short"){
    out.innerHTML = '<div class="msg">Please enter at least three letters of your name.</div>';
    return;
  }
  if(r.err === "none"){
    out.innerHTML = '<div class="msg">We couldn\'t match that name. Try your surname on its own, '+
                    'or check the spelling. Use seating arrangement chart.</div>';
    return;
  }
  var h = r.hits;
  if(h.length === 1){
    reveal(h[0].name, h[0].table);
    return;
  }
  if(h.length > 6){
    out.innerHTML = '<div class="msg">That matches too many guests. Please enter your full name.</div>';
    return;
  }
  out.innerHTML = '<div class="pick"><p>Several guests match. Tap your name:</p>'+
    h.map(function(g,i){
      return '<div class="row" data-i="'+i+'"><span>'+esc(g.name)+'</span><span>Table '+g.table+'</span></div>';
    }).join("")+'</div>';

  var rows = out.querySelectorAll(".row");
  rows.forEach(function(row){
    row.addEventListener("click",function(){
      var g = h[+row.getAttribute("data-i")];
      reveal(g.name, g.table);
    });
  });
}

document.getElementById("go").addEventListener("click",function(){
  inp.blur(); show(inp.value);
  setTimeout(function(){ window.scrollTo({top:0, behavior:"smooth"}); }, 150);
});
inp.addEventListener("keydown",function(e){
  if(e.key === "Enter"){
    e.preventDefault(); inp.blur(); show(inp.value);
    setTimeout(function(){ window.scrollTo({top:0, behavior:"smooth"}); }, 150);
  }
});
