<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Relationship Relovance — Find Your Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a060a;
  --navy:#241064;
  --maroon:#7a0e12;
  --gold:#caa03c;
  --card:#fffaf2;
  --ink:#241a1c;
  --muted:#8a7f74;
  --line:#ecdcc9
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 40px;background:var(--bg);color:var(--ink);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

.hero{width:100%;display:block;line-height:0}
.hero img{width:100%;height:auto;display:block}

.wrap{max-width:520px;margin:0 auto}
.panel{background:var(--card);border-radius:24px;padding:20px 20px 18px;
  margin:-18px 0 0;position:relative;z-index:1}

.panel-title{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:22px;
  color:var(--navy);text-align:center;margin:0 0 16px}
.panel-title .heart{color:var(--maroon)}

label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.8px;font-family:"Quicksand",sans-serif;font-weight:700}
input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;
  background:#fff;color:var(--ink);outline:none;font-family:inherit}
input:focus{border-color:var(--maroon)}
button{width:100%;margin-top:10px;padding:13px;font-size:16px;font-weight:700;border:0;
  border-radius:12px;background:var(--maroon);color:#fff;cursor:pointer;
  font-family:"Quicksand",sans-serif;letter-spacing:.3px}
button:active{opacity:.85}

#out{margin-top:14px}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;
  text-align:center}
.nm{font-size:14px;color:var(--muted);margin:0 0 6px;font-family:"Quicksand",sans-serif}
.tl{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--navy);margin:10px 0 0;
  font-weight:700;font-family:"Quicksand",sans-serif}

/* wheel */
.wheel-wrap{position:relative;width:220px;height:220px;margin:2px auto 0;
  filter:drop-shadow(0 8px 16px rgba(36,16,100,.28))}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:22px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#wheelSvg{width:100%;height:100%;display:block;
  transition:transform 2.6s cubic-bezier(.15,.75,.2,1);transform-origin:50% 50%}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);
  width:54px;height:54px;border-radius:50%;background:var(--navy);color:var(--gold);
  border:2.5px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:20px;z-index:3;pointer-events:none;
  font-family:"Playfair Display",Georgia,serif;
  transition:transform .5s cubic-bezier(.34,1.6,.64,1)}
.wheel-hub.landed{transform:translate(-50%,-50%) scale(1.16)}

.msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;
  font-size:14px;color:var(--muted)}
.pick{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pick p{margin:0;padding:12px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{font-size:15px;color:var(--ink)}
.row span:last-child{color:var(--maroon);font-weight:700;font-size:14px;white-space:nowrap;padding-left:14px}
.note{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}

.footer{margin-top:20px;text-align:center;font-size:10px;letter-spacing:.05em;color:var(--muted)}
.footer p{margin:0 0 3px}
.footer .brand{text-transform:uppercase;letter-spacing:.12em}
.footer a{color:inherit;text-decoration:none}
</style>
</head>

/* ── matching ─────────────────────────────────────────────── */
var TITLES = /^(ps|pastor|pst|dr|mr|mrs|ms|miss|rev|snr|sr)$/;

function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[’'`´]/g,"")
          .toLowerCase()
          .replace(/[^a-z0-9 ]/g," ")
          .split(/\s+/)
          .filter(function(t){return t && !TITLES.test(t);})
          .join(" ");
}

var INDEX = Object.keys(GUESTS).map(function(name){
  var n = norm(name);
  return {name:name, table:GUESTS[name], n:n, toks:n.split(" ")};
});

function search(raw){
  var q = norm(raw);
  if(q.length < 3) return {err:"short"};
  var qt = q.split(" ");

  var exact = INDEX.filter(function(g){return g.n === q;});
  if(exact.length) return {hits:exact};

  var hits = INDEX.filter(function(g){
    var pool = g.toks.slice();
    return qt.every(function(t){
      for(var i=0;i<pool.length;i++){
        if(pool[i].indexOf(t) === 0){ pool.splice(i,1); return true; }
      }
      return false;
    });
  });
  if(hits.length) return {hits:hits};

  hits = INDEX.filter(function(g){return g.n.indexOf(q) > -1;});
  return hits.length ? {hits:hits} : {err:"none"};
}

function show(raw){
  var r = search(raw||"");
  if(r.err === "short"){
    out.innerHTML = '<div class="msg">Please enter at least three letters of your name.</div>';
    return;
  }
  if(r.err === "none"){
    out.innerHTML = '<div class="msg">We couldn\'t match that name. Try your surname on its own, '+
                    'or check the spelling. Use seating arrangement chart.</div>';
    return;
  }
  var h = r.hits;
  if(h.length === 1){
    reveal(h[0].name, h[0].table);
    return;
  }
  if(h.length > 6){
    out.innerHTML = '<div class="msg">That matches too many guests. Please enter your full name.</div>';
    return;
  }
  out.innerHTML = '<div class="pick"><p>Several guests match. Tap your name:</p>'+
    h.map(function(g,i){
      return '<div class="row" data-i="'+i+'"><span>'+esc(g.name)+'</span><span>Table '+g.table+'</span></div>';
    }).join("")+'</div>';

  var rows = out.querySelectorAll(".row");
  rows.forEach(function(row){
    row.addEventListener("click",function(){
      var g = h[+row.getAttribute("data-i")];
      reveal(g.name, g.table);
    });
  });
}

  if(e.key === "Enter"){
