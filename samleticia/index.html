<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sam &amp; Leticia — Find Your Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b0d13;
  --card:#f6f1e7;
  --ink:#241a14;
  --muted:#8a7f74;
  --accent:#8f2a3a;
  --gold:#c9a55c;
  --line:#e4dccb
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 40px;background:var(--bg);color:var(--ink);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

/* ── hero photo band ─────────────────────────────────────── */
.hero-photo{width:100%;display:block;aspect-ratio:900/480;object-fit:cover;object-position:center top}
.hero-band{background:var(--bg);padding:16px 20px 20px;text-align:center}
.hero-band h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:32px;
  line-height:1.15;margin:0;color:#fff}
.hero-band .amp{display:inline-block;font-style:italic;font-weight:500;font-size:22px;
  color:#f2e4c9;margin:0 6px}
.hero-band .tag{font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:15px;
  color:#f2e4c9;margin:6px 0 0;letter-spacing:.02em}

/* ── editorial panel ──────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto}
.panel{background:var(--card);border-radius:26px 26px 0 0;padding:26px 22px 6px;
  margin-top:0;position:relative;z-index:1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.8px}
input{width:100%;padding:16px;font-size:17px;border:1px solid var(--line);border-radius:12px;
  background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:14px;padding:16px;font-size:17px;font-weight:600;border:0;
  border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:active{opacity:.85}
#out{margin-top:22px;padding-bottom:24px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;
  text-align:center}
.nm{font-size:15px;color:var(--muted);margin:0 0 10px}
.tl{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:6px 0 0}
.hint{font-size:11px;color:var(--muted);margin-top:14px;opacity:.7}

/* slot reel */
.reel-frame{height:64px;overflow:hidden;position:relative;margin:0 auto;width:100%;
  border-radius:8px}
.reel-frame::before,.reel-frame::after{content:"";position:absolute;left:0;right:0;
  height:20px;z-index:2;pointer-events:none}
.reel-frame::before{top:0;background:linear-gradient(#fff,transparent)}
.reel-frame::after{bottom:0;background:linear-gradient(transparent,#fff)}
.reel-track{display:flex;flex-direction:column;align-items:center}
.reel-track div{height:64px;line-height:64px;font-size:44px;font-weight:700;color:var(--accent)}

.msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;
  font-size:15px;color:var(--muted)}
.pick{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pick p{margin:0;padding:14px 18px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{font-size:16px;color:var(--ink)}
.row span:last-child{color:var(--accent);font-weight:600;font-size:15px;white-space:nowrap;padding-left:14px}
.note{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}

.footer{margin-top:26px;text-align:center;font-size:11px;letter-spacing:.06em;
  color:var(--muted)}
.footer p{margin:0 0 6px}
.footer .brand{text-transform:uppercase;letter-spacing:.12em}
.footer .tagline{text-transform:uppercase;letter-spacing:.16em;font-size:10px;opacity:.8}
.footer a{color:inherit;text-decoration:none}
</style>
</head>

/* ── matching ─────────────────────────────────────────────── */
var TITLES = /^(ps|pastor|pst|dr|mr|mrs|ms|miss|rev|snr|sr)$/;

function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[’'`´]/g,"")
          .toLowerCase()
          .replace(/[^a-z0-9 ]/g," ")
          .split(/\s+/)
          .filter(function(t){return t && !TITLES.test(t);})
          .join(" ");
}

var INDEX = Object.keys(GUESTS).map(function(name){
  var n = norm(name);
  return {name:name, table:GUESTS[name], n:n, toks:n.split(" ")};
});

function search(raw){
  var q = norm(raw);
  if(q.length < 3) return {err:"short"};
  var qt = q.split(" ");

  var exact = INDEX.filter(function(g){return g.n === q;});
  if(exact.length) return {hits:exact};

  var hits = INDEX.filter(function(g){
    var pool = g.toks.slice();
    return qt.every(function(t){
      for(var i=0;i<pool.length;i++){
        if(pool[i].indexOf(t) === 0){ pool.splice(i,1); return true; }
      }
      return false;
    });
  });
  if(hits.length) return {hits:hits};

  hits = INDEX.filter(function(g){return g.n.indexOf(q) > -1;});
  return hits.length ? {hits:hits} : {err:"none"};
}

/* ── UI ───────────────────────────────────────────────────── */
var out = document.getElementById("out"),
    inp = document.getElementById("q");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function reveal(name, table){
  var seq = [];
  var start = Math.max(1, table - 5);
  for(var n = start; n <= table; n++) seq.push(n);
  while(seq.length < 6) seq.unshift(seq[0] > 1 ? seq[0]-1 : 14);

  out.innerHTML =
    '<div class="card" id="card">'+
      '<p class="nm">'+esc(name)+'</p>'+
      '<div class="reel-frame"><div class="reel-track" id="track">'+
        seq.map(function(v){return '<div>'+v+'</div>';}).join('')+
      '</div></div>'+
      '<p class="tl">Table</p>'+
    '</div>';

  var track = document.getElementById("track");
  var rowH = 64;

  track.style.transform = "translateY(0px)";
  requestAnimationFrame(function(){
    track.style.transition = "transform 1.1s cubic-bezier(.12,.85,.15,1)";
    track.style.transform = "translateY(-"+((seq.length-1)*rowH)+"px)";
  });
}

function show(raw){
  var r = search(raw||"");
  if(r.err === "short"){
    out.innerHTML = '<div class="msg">Please enter at least three letters of your name.</div>';
    return;
  }
  if(r.err === "none"){
    out.innerHTML = '<div class="msg">We couldn\'t match that name. Try your surname on its own, '+
                    'or check the spelling. Use seating arrangement chart.</div>';
    return;
  }
  var h = r.hits;
  if(h.length === 1){
    reveal(h[0].name, h[0].table);
    return;
  }
  if(h.length > 6){
    out.innerHTML = '<div class="msg">That matches too many guests. Please enter your full name.</div>';
    return;
  }
  out.innerHTML = '<div class="pick"><p>Several guests match. Tap your name:</p>'+
    h.map(function(g,i){
      return '<div class="row" data-i="'+i+'"><span>'+esc(g.name)+'</span><span>Table '+g.table+'</span></div>';
    }).join("")+'</div>';

  var rows = out.querySelectorAll(".row");
  rows.forEach(function(row){
    row.addEventListener("click",function(){
      var g = h[+row.getAttribute("data-i")];
      reveal(g.name, g.table);
    });
  });
}

document.getElementById("go").addEventListener("click",function(){
  inp.blur(); show(inp.value);
});
inp.addEventListener("keydown",function(e){
  if(e.key === "Enter"){ e.preventDefault(); inp.blur(); show(inp.value); }
